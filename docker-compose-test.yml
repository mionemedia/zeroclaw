# ZeroClaw v0.7.0 Test Deployment
# Uses different ports and container names to avoid conflicts with production

services:
  zeroclaw-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeroclaw-test
    restart: unless-stopped
    
    environment:
      # OpenRouter API Key (same as production)
      - ZEROCLAW_API_KEY=${ZEROCLAW_API_KEY:-your-api-key-here}
      
      # Allow public bind for container networking
      - ZEROCLAW_ALLOW_PUBLIC_BIND=true
      
      # Test gateway on different port
      - ZEROCLAW_GATEWAY_PORT=42618
      
    volumes:
      # Mount new config location
      - $HOME/.zeroclaw:/zeroclaw-data/.zeroclaw:rw
      
      # Mount vault (same as production)
      - H:/Documents/Papi projects/Papi Random Project:/zeroclaw-data/workspace/knowledge:rw
      
    ports:
      # Different host port to avoid conflict with production
      - "42618:42618"
    
    # Resource limits (same as production)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 32M

    # Health check
    healthcheck:
      test: ["CMD", "zeroclaw", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

# Note: No volume definition needed - using bind mounts
